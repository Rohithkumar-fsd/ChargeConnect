services:
  postgres:
    image: postgis/postgis:16-3.7
    container_name: chargeconnect-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chargeconnect}
      POSTGRES_USER: ${POSTGRES_USER:-chargeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chargeconnect}
    ports:
      # Host 5433 avoids clashing with a local PostgreSQL on 5432. Inside Docker the port is still 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - chargeconnect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chargeconnect-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chargeconnect_postgres_data:
