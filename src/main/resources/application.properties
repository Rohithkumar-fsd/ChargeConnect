spring.application.name=chargeconnect

# Database — override with environment variables; do not commit real secrets.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/chargeconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chargeconnect}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chargeconnect}

# Schema is owned by Flyway, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

